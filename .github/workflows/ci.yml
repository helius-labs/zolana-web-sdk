name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache-dependency-path: wasm/go.sum
      - run: npm ci
      - run: npm run setup
      - run: npm run check
      - run: npm run test:browser
        env:
          CHROME_NO_SANDBOX: "1"
      - run: npm run test:consumer
        env:
          CHROME_NO_SANDBOX: "1"

  # The proof timing report of every shape (README, "Proof timing"), beside
  # the checks; it comments on the pull request. A newer push to a pull
  # request cancels its bench; every push to main is benched.
  bench:
    runs-on: ubuntu-latest
    concurrency:
      group: bench-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    env:
      ZOLANA_TIMING_DIR: ${{ github.workspace }}/.timing
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache-dependency-path: wasm/go.sum
      - run: npm ci
      - run: npm run setup
      - name: Proof timing
        timeout-minutes: 90
        run: node examples/browser/scripts/proof-timing.mjs
        env:
          CHROME_NO_SANDBOX: "1"
          ZOLANA_TIMING_LABEL: chrome
          # The page fetches every key from the key CDN, as an app does.
          VITE_ZOLANA_KEYS_URL: https://d3gbdb0egjwcw9.cloudfront.net/proving-keys/3a1c88f90f609eb1
      - name: Proof timing report
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/proof-timing-ci.sh chrome
      - if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: proof-timing-chrome
          path: |
            .timing/report.json
            .timing/report.md
          if-no-files-found: ignore

  # After each push to main, the bench report joins the history on the
  # proof-timing branch, which pull requests compare against. One push at a
  # time writes it.
  proof-timing-history:
    if: github.event_name == 'push' && !cancelled()
    needs: bench
    runs-on: ubuntu-latest
    concurrency:
      group: proof-timing-history
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # By name into a named directory: a single artifact matched by pattern
      # is extracted without one, and the history keys reports on it.
      - uses: actions/download-artifact@v8
        with:
          name: proof-timing-chrome
          path: ${{ runner.temp }}/reports/proof-timing-chrome
      - run: bash scripts/proof-timing-history.sh "$RUNNER_TEMP/reports"
        env:
          GH_TOKEN: ${{ github.token }}

  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: bash scripts/check-upstream.sh
