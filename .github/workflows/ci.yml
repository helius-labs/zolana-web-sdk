name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      # The prover runtime builds from the zopro revision runtime.lock.json pins.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-11-15
          targets: wasm32-unknown-unknown
          components: rust-src
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: npm ci
      - run: npm run setup
      - run: npm run check
      - run: npm run test:browser
        env:
          CHROME_NO_SANDBOX: "1"
      - uses: actions/cache@v5
        with:
          path: target/chrome-for-testing
          key: chrome-for-testing-${{ runner.os }}-${{ hashFiles('scripts/test-packed-consumer.mjs') }}
      - run: npm run test:consumer
        env:
          CHROME_NO_SANDBOX: "1"

  # The bench page, built once for every runner, with the keys from the key
  # CDN as an app loads them.
  bench-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      # The prover runtime builds from the zopro revision runtime.lock.json pins.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-11-15
          targets: wasm32-unknown-unknown
          components: rust-src
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: npm ci
      - run: npm run setup
      - run: npm run build:example
        env:
          VITE_ZOLANA_KEYS_URL: https://d3gbdb0egjwcw9.cloudfront.net/proving-keys/3a1c88f90f609eb1
      - uses: actions/upload-artifact@v7
        with:
          name: bench-page
          path: examples/browser/dist/

  # The proof timing of every shape (README, "Proof timing") in headless
  # Chrome, beside the checks: on Linux, a server VM, whether a commit made
  # proving faster or slower, and on macOS, an Apple M1 VM, the nearest to a
  # laptop. Each runner proves on its own processors. A newer push to a pull
  # request cancels its bench; every push to main is benched.
  bench:
    needs: bench-page
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    concurrency:
      group: bench-${{ matrix.os }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    env:
      ZOLANA_TIMING_DIR: ${{ github.workspace }}/timing
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: bench-page
          path: examples/browser/dist
      - name: Proof timing
        timeout-minutes: 90
        run: node examples/browser/scripts/proof-timing.mjs
        env:
          CHROME_NO_SANDBOX: ${{ runner.os == 'Linux' && '1' || '' }}
          ZOLANA_TIMING_BUILT: "1"
      - if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: proof-timing-${{ matrix.os }}
          path: timing/
          if-no-files-found: ignore

  # One report of every runner, commented on the pull request; after a push
  # to main it joins the history on the proof-timing branch, which pull
  # requests compare against, and is commented on the commit. One push at a
  # time writes the history.
  bench-report:
    if: ${{ !cancelled() && needs.bench.result != 'skipped' }}
    needs: bench
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.event_name == 'push' && 'proof-timing-history' || format('proof-timing-report-{0}', github.ref) }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    env:
      ZOLANA_TIMING_DIR: ${{ github.workspace }}/timing
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # A runner that failed before its first proof uploads no logs.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: proof-timing-*
          merge-multiple: true
          path: timing
      - name: Proof timing report
        env:
          GH_TOKEN: ${{ github.token }}
          # The macOS VM's times vary up to twice over between runs of one
          # commit on one processor, so only Linux is compared.
          ZOLANA_TIMING_COMPARE: chrome-linux
        run: bash scripts/proof-timing-ci.sh
      - if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/proof-timing-history.sh "$ZOLANA_TIMING_DIR"

  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: bash scripts/check-upstream.sh
